name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    # PostgreSQL 16 (minimum de l'ADR 0001) pour les tests de persistance ; jetable, sans donnée réelle.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fabcore
          POSTGRES_PASSWORD: fabcore-ci
          POSTGRES_DB: fabcore_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fabcore" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FABCORE_TEST_DATABASE_URL: postgres://fabcore:fabcore-ci@localhost:5432/fabcore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # pg_dump/pg_restore de la version du serveur (16) pour les tests de `fabcore backup/restore`.
      - run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            # Dépôt officiel PostgreSQL (PGDG) : l'image du runner ne fournit pas le client 16.
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
          fi
          /usr/lib/postgresql/16/bin/pg_dump --version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:licenses
      - run: node scripts/openapi.mjs --check
