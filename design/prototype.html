<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FabCore · Atelier</title><link rel="icon" href="brand/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#101312;--side:#141816;--card:#1a1f1c;--raised:#222924;--line:#303a33;--text:#eef3ee;--dim:#a5b3a9;--accent:#57e489;--on:#0c2617;--soft:#183825;--blue:#8ccaff;--amber:#f4c97c;--red:#ff9b98;--shadow:#0003;--radius:13px;font-family:Inter,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light;--bg:#f1f5f1;--side:#fbfdfb;--card:#fff;--raised:#e9f0eb;--line:#ccd8cf;--text:#17251c;--dim:#4c6053;--accent:#096a37;--on:#fff;--soft:#dcf4e5;--blue:#145a9b;--amber:#795003;--red:#a83330;--shadow:#17392316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,select{font:inherit}button,select{cursor:pointer}button,input,select{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);min-height:42px;padding:9px 13px}button{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}button:hover{background:var(--raised)}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.primary{background:var(--accent);color:var(--on);border-color:transparent}.primary:hover{background:var(--accent);filter:brightness(.92)}.ghost{background:transparent}.danger{color:var(--red)}.ico{width:19px;height:19px;flex:none;vertical-align:middle}.muted,small{color:var(--dim)}small{font-size:12px}h1,h2,h3,p{margin:0}h1{font-size:clamp(29px,4vw,42px);line-height:1.08;letter-spacing:-.05em}h2{font-size:21px;letter-spacing:-.025em}h3{font-size:15px}p{line-height:1.55}header,main,aside,section{min-width:0}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100dvh;background:var(--side);border-right:1px solid var(--line);padding:25px 15px 17px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:780;letter-spacing:-.06em;padding:0 9px;color:var(--text);text-decoration:none}.brand svg{width:36px;height:36px;color:var(--accent)}.brand strong{color:var(--accent)}nav{display:grid;gap:3px}nav button{justify-content:flex-start;border:0;background:transparent;color:var(--dim);font-size:13px;text-align:left}nav button[aria-current=page]{background:var(--soft);color:var(--accent)}.sidefoot{margin-top:auto;border-top:1px solid var(--line);display:grid;padding-top:12px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 27px;min-height:65px;background:var(--side);gap:10px}.crumb,.row{display:flex;align-items:center;gap:9px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.top button{min-height:36px;padding:6px 10px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;flex:none}.area{max-width:1450px;margin:auto;padding:30px 27px 55px}.hero{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:23px}.hero p{margin-top:9px;color:var(--dim)}.eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:26px}.panel,.stat,.machine{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 16px var(--shadow)}.stat{padding:15px}.stat strong{display:block;font-size:28px;margin-top:5px;letter-spacing:-.045em}.stat .ico{color:var(--accent)}.main-grid{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(232px,1fr);gap:17px;align-items:start}.section-head{margin-bottom:13px}.panel{padding:16px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cards.list{grid-template-columns:1fr}.machine{padding:14px;display:grid;gap:10px;min-width:0}.machine h3,.machine small,.job{overflow-wrap:anywhere}.machine button{width:100%;justify-content:space-between}.machine-mark{display:grid;place-items:center;width:36px;height:36px;background:var(--raised);border:1px solid var(--line);border-radius:9px;color:var(--accent);flex:none}.badge{border:1px solid var(--line);border-radius:20px;padding:4px 8px;font-size:11px;font-weight:650;background:var(--raised);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}.badge::before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.good{color:var(--accent)}.info{color:var(--blue)}.warn{color:var(--amber)}.bad{color:var(--red)}.neutral{color:var(--dim)}progress{width:100%;height:7px;appearance:none;border:0;border-radius:9px;background:var(--raised);overflow:hidden;display:block}progress::-webkit-progress-bar{background:var(--raised)}progress::-webkit-progress-value{background:var(--accent)}progress::-moz-progress-bar{background:var(--accent)}.job{font-size:12px;color:var(--dim);padding-top:1px}.activity{padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}.activity:last-child{border:0}.activity .ico{margin-top:2px}.activity p{font-size:13px}.stack{display:grid;gap:13px}.fields{display:grid;gap:12px}.fields label{display:grid;gap:6px;color:var(--dim);font-weight:550}.fields input,.fields select{width:100%}.fields input[type=checkbox]{width:auto;min-height:0}.fields label.check{display:flex;align-items:center;gap:10px}.fields .row input{width:auto}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;text-align:left}.table td,.table th{padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{color:var(--dim);font-size:12px}.table td:first-child{overflow-wrap:anywhere}.feed{min-height:240px;background:radial-gradient(ellipse at 50% 65%,#46534a,#161e19 70%);border:1px solid var(--line);border-radius:10px;position:relative;display:grid;place-items:center;overflow:hidden;color:#f2f8f3}.feed svg{width:min(75%,340px);height:205px}.feed span{position:absolute;left:12px;top:12px;background:#0b130edb;border-radius:6px;padding:6px 9px;font-size:12px}.feed.off{background:var(--raised);color:var(--dim)}.feed.off .ico{width:35px;height:35px}.setup{max-width:760px;margin:24px auto}.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin:0 0 16px}.steps li{border-top:3px solid var(--line);padding-top:6px;color:var(--dim);font-size:11px;overflow-wrap:anywhere}.steps li.current{border-color:var(--accent);color:var(--accent);font-weight:700}.steps li.done{border-color:var(--accent)}.setup .panel{padding:clamp(16px,4vw,28px)}.setup .fields{margin:18px 0}.error{color:var(--red);font-size:13px}.notice{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--dim)}.toast{position:fixed;bottom:17px;right:17px;z-index:5;max-width:min(390px,calc(100vw - 34px));padding:12px 16px;background:var(--card);color:var(--text);border:1px solid var(--accent);border-radius:10px;box-shadow:0 6px 24px var(--shadow)}dialog{max-width:min(510px,calc(100% - 26px));color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}dialog::backdrop{background:#0009}.mobile{display:none}.signal{font-size:11px;color:var(--accent);letter-spacing:.02em;font-weight:700}.labelled select{max-width:190px}code{overflow-wrap:anywhere}.skip{position:absolute;left:10px;top:-100px;z-index:4;background:var(--card);padding:10px}.skip:focus{top:8px}
@media(max-width:1050px){.layout{grid-template-columns:185px minmax(0,1fr)}.main-grid{grid-template-columns:1fr}.area{padding-inline:21px}.top{padding-inline:21px}}
@media(max-width:720px){.layout{display:block}.sidebar{display:none}.top{padding:8px 13px;min-height:57px}.area{padding:21px 13px 85px}.mobile{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;z-index:3;background:var(--side);border-top:1px solid var(--line);padding:3px 4px max(3px,env(safe-area-inset-bottom));gap:2px}.mobile button{flex-direction:column;justify-content:center;gap:2px;padding:4px;font-size:10px;min-height:48px}.mobile .ico{width:17px;height:17px}.toast{bottom:66px}.hero{align-items:flex-start;flex-wrap:wrap}.stats{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:17px;gap:7px}.stat{padding:10px}.cards{gap:8px}.machine{padding:10px}.machine .machine-mark{display:none}.machine .row:first-child{flex-wrap:wrap}.steps li{font-size:0}.steps li::after{content:attr(data-number);font-size:12px}.hide-mobile{display:none}}
@media(max-width:365px){.cards{grid-template-columns:1fr}.crumb span{display:none}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,color .15s}}
</style>
</head>
<body><div id="app"></div><dialog id="dialog"></dialog><div id="status" role="status" aria-live="polite"></div>
<script>
const t=(fr,en)=>state.lang==='fr'?fr:en;
const icons={
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 machine:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8m-4 0v5l2 2h-4l2-2m-4 5h8"/>',
 camera:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',
 file:'<path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>',
 bell:'<path d="M5 16h14l-2-3V9A5 5 0 0 0 7 9v4zm5 4h4"/>',
 history:'<circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/>',
 users:'<circle cx="10" cy="8" r="3"/><path d="M4 20v-2a6 6 0 0 1 12 0v2m1-14a3 3 0 0 1 0 6m1 3c2 0 3 2 3 4"/>',
 control:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--card)"/><circle cx="15" cy="12" r="2" fill="var(--card)"/><circle cx="9" cy="18" r="2" fill="var(--card)"/>',
 plug:'<path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0zm6 9v4"/>',
 arrow:'<path d="M4 12h15m-5-5 5 5-5 5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 activity:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
 check:'<path d="m5 12 4 4 10-10"/>',
 alert:'<path d="m12 3 10 17H2Zm0 6v4m0 3v1"/>',
 list:'<path d="M9 6h12M9 12h12M9 18h12M4 6h1M4 12h1M4 18h1"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'
};
const icon=(name)=>`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.grid}</svg>`;
const mark=`<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M32 4 56 18v12l-9-5v-2L32 14 17 23v18l15 9 15-9v-7l9 5v7L32 60 8 46V18z"/><path fill="currentColor" d="m32 22 11 6v12l-11 6-11-6V28z"/></svg>`;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pref=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};
const media=matchMedia('(prefers-color-scheme: light)');
const demo=[
 {id:'P2S-01',name:'Bambu P2S',model:'Bambu Lab P2S · AMS',address:'192.0.2.21',status:'printing',progress:68,file:'support-capteur.3mf',eta:'42 min',nozzle:220,bed:60,camera:true,control:true},
 {id:'CC2-01',name:'Elegoo CC2 · 01',model:'Elegoo Centauri Carbon 2',address:'192.0.2.31',status:'ready',progress:0,file:'',eta:'',nozzle:24,bed:25,camera:true,control:true},
 {id:'CC2-02',name:'Elegoo CC2 · 02',model:'Elegoo Centauri Carbon 2',address:'192.0.2.32',status:'error',progress:37,file:'boitier-abs.gcode',eta:'',nozzle:34,bed:36,camera:false,control:true},
 {id:'K1-01',name:'Creality K1 Max',model:'Creality K1 Max',address:'192.0.2.41',status:'done',progress:100,file:'guide-cable.gcode',eta:'',nozzle:29,bed:30,camera:true,control:true},
 {id:'KL-01',name:'Ender 3 · Klipper',model:'Moonraker / Klipper',address:'192.0.2.51',status:'offline',progress:0,file:'',eta:'',nozzle:null,bed:null,camera:false,control:false},
 {id:'MK4-01',name:'Prusa MK4S',model:'PrusaLink',address:'192.0.2.61',status:'ready',progress:0,file:'',eta:'',nozzle:24,bed:24,camera:false,control:false}
];
const state={lang:pref('fabcore-lang','fr'),theme:pref('fabcore-theme','dark'),page:'home',machine:'P2S-01',machines:structuredClone(demo),layout:'grid',filter:'all',role:'admin',step:0,setup:{},files:['support-capteur.3mf','boitier-abs.gcode','guide-cable.gcode'],users:[{name:'Camille Martin',email:'camille@example.test',role:'admin'},{name:'Alex Bernard',email:'alex@example.test',role:'operator'},{name:'Sam Petit',email:'sam@example.test',role:'viewer'}],events:[{id:'CC2-02',kind:'error',fr:'Fabrication interrompue',en:'Print interrupted',time:'09:42'},{id:'K1-01',kind:'done',fr:'Fabrication terminée',en:'Print completed',time:'09:31'},{id:'KL-01',kind:'offline',fr:'Connexion perdue',en:'Connection lost',time:'09:18'}],unread:true};
const app=document.querySelector('#app'), dialog=document.querySelector('#dialog');
const pages=()=>({home:['grid',t('Vue d’ensemble','Overview')],machines:['machine',t('Machines','Machines')],cameras:['camera',t('Caméras','Cameras')],files:['file',t('Fichiers','Files')],notifications:['bell','Notifications'],history:['history',t('Historique','History')],users:['users',t('Utilisateurs','Users')],connectors:['plug',t('Connecteurs','Connectors')],settings:['control',t('Paramètres','Settings')],more:['menu',t('Plus','More')],setup:['plug',t('Première installation','First setup')],login:['users',t('Connexion','Sign in')],detail:['machine',t('Machine','Machine')]});
const roles=()=>({admin:t('Administrateur','Administrator'),operator:t('Opérateur','Operator'),viewer:t('Observateur','Viewer')});
const states=()=>({printing:[t('En fabrication','Printing'),'info'],ready:[t('Disponible','Ready'),'good'],error:[t('Erreur','Error'),'bad'],done:[t('Terminée','Completed'),'good'],offline:[t('Hors ligne','Offline'),'neutral'],paused:[t('En pause','Paused'),'warn'],connecting:[t('Connexion…','Connecting…'),'info']});
const machine=(id)=>state.machines.find(m=>m.id===id);
const label=(id)=>machine(id)?.name||id;
const btn=(action,title,glyph='',classes='',attrs='')=>`<button type="button" data-action="${action}" class="${classes}" ${attrs}>${glyph?icon(glyph):''}${title}</button>`;
const nav=(id,short)=>btn('nav:'+id,short||pages()[id][1],pages()[id][0],'',state.page===id?'aria-current="page"':'');
const badge=(status)=>`<span class="badge ${states()[status][1]}">${states()[status][0]}</span>`;
const options=(values,selected)=>Object.entries(values).map(([value,name])=>`<option value="${esc(value)}" ${selected===value?'selected':''}>${esc(name)}</option>`).join('');
const brand=()=>`<a href="#home" class="brand" aria-label="FabCore">${mark}<span>Fab<strong>Core</strong></span></a>`;
const title=(name,sub='',action='')=>`<div class="hero"><div><h1 tabindex="-1">${name}</h1>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`;
function render(focus=false){
 document.documentElement.lang=state.lang;
 document.documentElement.dataset.theme=state.theme==='system'?(media.matches?'light':'dark'):state.theme;
 const p=pages();
 const full=state.page==='setup'||state.page==='login';
 const current=state.page==='detail'?label(state.machine):p[state.page][1];
 const content={home:dashboard,machines:machines,cameras:cameras,files:files,notifications:notifications,history:history,users:users,connectors:connectors,settings:settings,more:more,setup:setup,login:login,detail:detail};
 app.innerHTML=`<a class="skip" href="#content">${t('Aller au contenu','Skip to content')}</a><div class="${full?'':'layout'}">${full?'':`<aside class="sidebar">${brand()}<nav aria-label="${t('Navigation principale','Main navigation')}">${['home','machines','cameras','files','notifications','history','users','connectors','settings'].map(id=>nav(id)).join('')}</nav><div class="sidefoot"><small class="signal">● ${t('Environnement de démonstration','Demo environment')}</small>${nav('setup')}</div></aside>`}
 <div><header class="top"><div class="crumb">${full?brand():`${icon(p[state.page][0])}<span>${esc(current)}</span>`}</div><div class="row">
 ${!full?`<span class="signal hide-mobile">${t('Simulation','Simulation')}</span>`:''}
 ${btn('lang',state.lang==='fr'?'EN':'FR','','ghost',`aria-label="${state.lang==='fr'?'Switch to English':'Passer en français'}"`)}
 ${btn('theme','','sun','ghost',`aria-label="${t('Basculer le thème','Toggle theme')}"`)}
 ${full?'':btn('nav:notifications',state.unread?'•':'','bell','ghost',`aria-label="${t('Notifications','Notifications')}"`)}
 ${full?'':btn('nav:settings',esc(roles()[state.role]),'','ghost','aria-label="'+t('Profil et rôle de démonstration','Profile and demo role')+'"')}
 </div></header><main id="content" class="area" tabindex="-1">${content[state.page]()}</main></div></div>
 ${full?'':`<nav class="mobile" aria-label="${t('Navigation mobile','Mobile navigation')}">${nav('home',t('Atelier','Overview'))}${nav('machines')}${nav('notifications',t('Alertes','Alerts'))}${nav('more')}</nav>`}`;
 if(focus)app.querySelector('h1')?.focus();
}
function listEvents(events=state.events){
 return events.length?events.map(e=>`<div class="activity row">${icon(e.kind==='error'?'alert':e.kind==='done'?'check':'activity')}<div style="flex:1"><p>${esc(t(e.fr,e.en))}</p><small>${esc(label(e.id))} · ${esc(e.time)}</small></div>${machine(e.id)?btn('machine:'+e.id,'','arrow','ghost',`aria-label="${esc(label(e.id))}"`):''}</div>`).join(''):`<p class="muted">${t('Aucun événement.','No events.')}</p>`;
}
function card(m){
 const isActive=['printing','paused'].includes(m.status);
 return `<article class="machine"><div class="row between"><div class="row"><span class="machine-mark">${icon('machine')}</span><div><h3>${esc(m.name)}</h3><small>${esc(m.model)}</small></div></div>${badge(m.status)}</div>
 <div class="row between job"><span>${esc(m.file)||t('Aucune fabrication','No job')}</span><strong>${isActive?m.progress+' %':(m.status==='done'?'100 %':'')}</strong></div>
 <progress value="${m.progress}" max="100" aria-label="${t('Progression','Progress')}"></progress>
 <div class="row between"><small>${m.eta?esc(m.eta)+' · ':''}${m.nozzle===null?t('Dernière liaison perdue','Connection lost'):m.nozzle+' °C · '+m.bed+' °C'}</small><small>${esc(m.id)}</small></div>
 ${btn('machine:'+m.id,t('Ouvrir','Open')+' '+esc(m.name),'arrow','ghost')}</article>`;
}
function dashboard(){
 const totals=[state.machines.length,state.machines.filter(m=>m.status==='printing').length,state.machines.filter(m=>m.status==='ready').length,state.machines.filter(m=>['offline','error'].includes(m.status)).length];
 const captions=[[t('Machines','Machines'),'machine'],[t('En fabrication','Printing'),'activity'],[t('Disponibles','Ready'),'check'],[t('À vérifier','Needs attention'),'alert']];
 return `${title(t('Vue d’ensemble','Workshop overview'),t('État du parc et activité récente de votre atelier.','Fleet status and recent workshop activity.'),state.role==='viewer'?'':btn('add',t('Ajouter une machine','Add machine'),'plus','primary'))}
 <div class="stats">${captions.map(([text,glyph],i)=>`<div class="stat"><div class="row">${icon(glyph)}<small>${text}</small></div><strong>${totals[i]}</strong></div>`).join('')}</div>
 <div class="main-grid"><section><div class="row between section-head"><h2>${t('Machines','Machines')}</h2>${btn('nav:machines',t('Tout le parc','View fleet'),'arrow','ghost')}</div><div class="cards">${state.machines.slice(0,6).map(card).join('')||`<p class="muted">${t('Ajoutez une machine pour commencer.','Add a machine to get started.')}</p>`}</div></section>
 <section class="panel"><div class="row between section-head"><h2>${t('Activité récente','Recent activity')}</h2>${icon('activity')}</div>${listEvents(state.events.slice(0,4))}<div style="margin-top:12px">${btn('nav:history',t('Voir l’historique','View history'),'arrow','ghost')}</div></section></div>`;
}
function machines(){
 const visible=state.machines.filter(m=>state.filter==='all'||m.status===state.filter);
 return `${title(t('Machines','Machines'),t('Filtrez le parc par état. Chaque équipement conserve son identifiant.','Filter the fleet by status. Each device keeps its own identifier.'),state.role==='viewer'?'':btn('add',t('Ajouter une machine','Add machine'),'plus','primary'))}
 <div class="row between wrap section-head"><label class="row labelled">${t('État','Status')}<select id="filter">${options({all:t('Tous les états','All statuses'),...Object.fromEntries(Object.entries(states()).map(([k,v])=>[k,v[0]]))},state.filter)}</select></label><div class="row">${btn('view:grid',t('Grille','Grid'),'grid','ghost',`aria-pressed="${state.layout==='grid'}"`)}${btn('view:list',t('Liste','List'),'list','ghost',`aria-pressed="${state.layout==='list'}"`)}</div></div>
 <div class="cards ${state.layout}">${visible.map(card).join('')||`<div class="panel">${t('Aucune machine pour cet état.','No machines match this status.')}</div>`}</div>`;
}

 if(action==='add'&&state.role!=='viewer')modal(t('Ajouter une machine','Add machine'),`<div class="fields">${field('name',t('Nom','Name'))}${field('address',t('Adresse fictive','Sample address'))}</div>`,t('Ajouter','Add'),data=>{const name=data.get('name').trim();const address=data.get('address').trim();if(!name||!address)return t('Renseignez le nom et l’adresse.','Enter a name and address.');addMachine(name,address)});
 if(action==='file-add'&&state.role!=='viewer')modal(t('Ajouter un fichier fictif','Add a demo file'),`<div class="fields">${field('name',t('Nom du fichier','File name'))}</div>`,t('Ajouter','Add'),data=>{const name=data.get('name').trim();if(!name)return t('Renseignez le nom.','Enter a name.');state.files.push(name)});
 if(action==='user-add'&&state.role==='admin')modal(t('Ajouter un utilisateur','Add user'),`<div class="fields">${field('name',t('Nom','Name'))}${field('email',t('E-mail fictif','Demo email'),'email')}<label>${t('Rôle','Role')}<select name="role">${options(roles(),'viewer')}</select></label></div>`,t('Ajouter','Add'),data=>{const email=data.get('email').trim();if(state.users.some(u=>u.email.toLowerCase()===email.toLowerCase()))return t('Cette adresse est déjà utilisée.','This address already exists.');const name=data.get('name').trim();if(!name)return t('Renseignez le nom.','Enter a name.');state.users.push({name,email,role:data.get('role')})});
 if(action==='connector')modal(t('Capacités à valider','Capabilities to validate'),`<p>${Number(value)<6?t('Télémétrie, fichiers, commandes et caméra — validation distincte par modèle et firmware.','Telemetry, files, controls and camera — validate per model and firmware.'):t('Aperçu du catalogue : résine, laser ou CNC. Le pilotage sera défini selon la famille de machines.','Catalog preview: resin, laser or CNC. Controls will depend on the machine family.')}</p>`);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='filter'){state.filter=el.value;render();app.querySelector('#filter').focus()}
 if(el.id==='role'){state.role=el.value;render();app.querySelector('#role').focus()}
 if(el.id==='theme'){state.theme=el.value;save('fabcore-theme',el.value);render();app.querySelector('#theme').focus()}
 if(el.id==='language'){state.lang=el.value;save('fabcore-lang',el.value);render();app.querySelector('#language').focus()}
 if(el.dataset.roleIndex&&state.role==='admin'){state.users[el.dataset.roleIndex].role=el.value;toast(t('Rôle modifié.','Role updated.'))}
 if(el.closest('[data-fields]')||el.closest('#setup-form')){
  if(el.name==='discovered'){cacheSetup(el.form);return}
  if(el.name&&!['password','confirm','secret'].includes(el.name)){
   state.setup[el.name]=el.type==='checkbox'?el.checked:el.value;
   if(['auth','ntfy','smtp','manual'].includes(el.name)){render();app.querySelector('[name="'+el.name+'"]').focus()}
  }
 }
});
document.addEventListener('submit',e=>{
 if(e.target.id==='setup-form'){e.preventDefault();const error=submitSetup(e.target);if(error)e.target.querySelector('#form-error').textContent=error}
 if(e.target.id==='login-form'){e.preventDefault();go('home');toast(t('Connexion simulée.','Simulated sign-in.'))}
});
addEventListener('popstate',fromHash);
addEventListener('hashchange',()=>{if(location.hash!=='#content')fromHash()});
media.addEventListener('change',()=>{if(state.theme==='system'){document.documentElement.dataset.theme=media.matches?'light':'dark'}});
fromHash();
</script>
</body></html>
